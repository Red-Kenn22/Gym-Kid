<style>
:root{
  --bg:#0b0f19; --card:#111827; --card2:#0e1522; --line:#1f2937; --line2:#2c3a50;
  --ink:#e8edf5; --ink2:#a9b4c8; --ink3:#8090a8;
  --green:#10b981; --cyan:#06b6d4; --gold:#f59e0b; --red:#f87171;
  --display:"Avenir Next Condensed","Roboto Condensed","Barlow Condensed","Arial Narrow",sans-serif-condensed,system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --nav-h:62px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  font-family:var(--body);color:var(--ink);font-size:15px;line-height:1.45;
  background:
    linear-gradient(rgba(6,182,212,.03) 1px,transparent 1px) 0 0/100% 28px,
    linear-gradient(90deg,rgba(6,182,212,.03) 1px,transparent 1px) 0 0/28px 100%,
    var(--bg);
  min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
body.locked{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.01em}

.app{max-width:480px;margin:0 auto;padding:calc(14px + var(--safe-t)) 14px calc(var(--nav-h) + var(--safe-b) + 26px)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 2px 14px}
.top h1{font-family:var(--display);font-size:27px;line-height:1;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.top p{color:var(--ink2);font-size:13px;margin-top:5px;max-width:34ch}
.daychip{font-family:var(--display);font-weight:700;font-size:15px;color:var(--cyan);border:1px solid rgba(6,182,212,.4);padding:4px 10px;border-radius:999px;white-space:nowrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.row>h2{flex:1;min-width:0}.row>span{flex:none;white-space:nowrap}
.muted{color:var(--ink2)} .small{font-size:12.5px}
.note{font-size:12.5px;color:var(--ink2);margin-top:12px;line-height:1.5}
.linkbtn{color:var(--cyan);text-decoration:underline;text-underline-offset:3px;font-size:13px;padding:8px 0;min-height:36px}

/* ---------- Player card: the one loud thing ---------- */
.pcard{--tier:var(--green);--tier2:var(--cyan);position:relative;margin-bottom:12px;padding:1.5px;
  background:linear-gradient(135deg,var(--tier),rgba(255,255,255,.08) 38%,rgba(255,255,255,.04) 62%,var(--tier2));
  clip-path:polygon(0 18px,18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%)}
.pcard.t0{--tier:#5b6b84;--tier2:var(--green)}
.pcard.t1{--tier:var(--cyan);--tier2:#7dd3fc}
.pcard.t2{--tier:var(--green);--tier2:var(--cyan)}
.pcard.t3{--tier:var(--gold);--tier2:#fde68a}
.pc-in{clip-path:inherit;background:
    repeating-linear-gradient(115deg,rgba(255,255,255,.028) 0 2px,transparent 2px 13px),
    radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--tier) 22%,transparent),transparent 60%),
    #0d1320;
  padding:16px 16px 13px}
.pc-main{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center}
.pc-left{border-right:1px solid rgba(255,255,255,.09);padding-right:10px}
.ovr{font-size:78px;line-height:.86;color:#fff;text-shadow:0 0 26px color-mix(in srgb,var(--tier) 55%,transparent)}
.ovr-l{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--tier);margin-top:7px}
.pname{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow{display:grid;grid-template-columns:36px 1fr auto;column-gap:8px;align-items:baseline;margin-bottom:8px}
.arow:last-child{margin-bottom:0}
.acode{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--ink)}
.aname{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aval{font-size:22px;line-height:1;color:#fff}
.xpbar{grid-column:1/-1;height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.pc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px;padding-top:11px;border-top:1px solid rgba(255,255,255,.09);font-size:12.5px;color:var(--ink2)}
.tier{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#0b0f19;background:var(--tier);padding:3px 10px 2px;border-radius:4px;white-space:nowrap}

/* ---------- Clearance ---------- */
.mgline{font-size:13px;color:var(--ink2)} .mgline b{font-size:24px;color:var(--ink)}
.fuelbtn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:60px;margin-top:13px;padding:0 18px;border-radius:14px;
  background:linear-gradient(180deg,#14c38b,#0c9a6b);color:#04130d;font-weight:700;font-size:16.5px;box-shadow:0 8px 24px -10px rgba(16,185,129,.8),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s}
.fuelbtn:active{transform:scale(.975)}
.fuelbtn span{font-family:var(--display);font-size:19px;background:rgba(4,19,13,.16);padding:3px 10px;border-radius:8px}
.fueldone{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px;margin-top:13px;padding:0 8px 0 16px;border-radius:14px;border:1px solid rgba(16,185,129,.5);background:rgba(16,185,129,.09);font-weight:600}
.fueldone>span{display:flex;align-items:center;gap:8px}
.fueldone svg{flex:none}
.fueldone button{color:var(--ink2);font-size:13.5px;padding:12px 10px;text-decoration:underline;text-underline-offset:3px}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.stage{display:flex;gap:3px;margin-top:16px}
.seg{height:14px;background:#1b2536;overflow:hidden}
.seg:first-child{border-radius:7px 2px 2px 7px}.seg:last-child{border-radius:2px 7px 7px 2px}
.seg i{display:block;height:100%;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.seg.s1 i{background:linear-gradient(90deg,#0c8f66,var(--green))}
.seg.s2 i{background:linear-gradient(90deg,#c97f08,var(--gold))}
.stagelbl{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--ink2);white-space:nowrap}
.stagelbl div:first-child{flex:1;text-align:right}
.stagelbl div:last-child{flex:none;text-align:right}
.stagelbl b{display:block;color:var(--ink);font-family:var(--display);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px}
.stat b{display:block;font-size:21px;line-height:1.1;white-space:nowrap}
.stat span{display:block;font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.25}
.window{margin-top:12px;font-size:13.5px} .window b{color:var(--cyan)}

/* ---------- Reward ---------- */
.pips{display:grid;gap:4px;margin-top:13px}
.pips i{height:15px;border-radius:3px;background:#1b2536}
.pips i.on{background:var(--gold);box-shadow:0 0 10px -2px rgba(245,158,11,.7)}
.plainbar{height:14px;border-radius:7px;background:#1b2536;overflow:hidden;margin-top:13px}
.plainbar i{display:block;height:100%;background:var(--gold)}
.count b{font-size:26px;color:var(--gold)}

.nudge{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px dashed var(--line2);border-radius:14px;padding:10px 12px 10px 14px;margin-bottom:12px;font-size:13px;color:var(--ink2)}
.banner{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.45);color:#fecaca;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}

/* ---------- Garage ---------- */
.pit{display:flex;gap:10px;align-items:flex-start;border-left:3px solid var(--gold);background:rgba(245,158,11,.07);border-radius:0 12px 12px 0;padding:10px 12px;margin-bottom:12px;font-size:13px;color:#e9dcc0;line-height:1.45}
.pit b{color:var(--gold)}
.block{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.block.done{border-color:rgba(16,185,129,.55)}
.bhead{display:grid;grid-template-columns:34px 1fr auto 26px;gap:10px;align-items:center;width:100%;text-align:left;padding:13px 14px;min-height:64px}
.bnum{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:19px;background:#1b2536;color:var(--ink2)}
.block.done .bnum{background:var(--green);color:#04130d}
.btitle b{display:block;font-family:var(--display);font-size:18px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.btitle small{font-size:12.5px;color:var(--ink2)}

.tip{margin-top:12px;font-size:13px;color:var(--ink2)}
details.why{margin-top:12px;border-radius:10px;background:var(--card2);border:1px solid var(--line)}

.btn{flex:1 1 130px;min-height:46px;border-radius:12px;font-weight:600;font-size:14.5px;padding:0 14px;border:1px solid var(--line2);color:var(--ink);background:#162033}

nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:2.5px;background:var(--green);border-radius:0 0 3px 3px}

/* ---------- Modal / toast / timer ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(3,6,12,.78);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:480px;max-height:90dvh;overflow:auto;background:var(--card);border:1px solid var(--line2);border-bottom:0;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + var(--safe-b));animation:up .26s cubic-bezier(.2,.9,.2,1)}
.sheet h2{font-family:var(--display);font-size:23px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.sheet p{color:var(--ink2);font-size:14px;margin-top:8px}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(40px);opacity:0}}
.days{list-style:none;margin-top:10px}
.days li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.days button{min-height:40px;min-width:92px;border-radius:10px;border:1px solid var(--line2);font-weight:600;font-size:13.5px;color:var(--ink2)}
.days button.on{background:rgba(16,185,129,.14);border-color:rgba(16,185,129,.6);color:#a7f3d0}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 18px);transform:translateX(-50%);z-index:70;background:#e8edf5;color:#0b0f19;font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:up .25s;max-width:calc(100vw - 40px);text-align:center}

.celebrate{text-align:center;position:relative}
.celebrate .big{font-size:60px;line-height:1;color:var(--gold);margin-top:6px}
.gains{margin-top:16px;text-align:left}
.gain{display:grid;grid-template-columns:40px 1fr auto;column-gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}

.gain .gx{font-family:var(--display);font-weight:700;color:var(--cyan);font-size:16px}
.gain .xpbar{margin-top:6px;height:7px}
.facts{list-style:none;margin-top:14px;text-align:left}
.facts li{padding:6px 0 6px 26px;position:relative;font-size:14px}
.facts li::before{content:"";position:absolute;left:4px;top:12px;width:10px;height:10px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
.burst{position:absolute;left:50%;top:38px;width:0;height:0;pointer-events:none}
.burst i{position:absolute;width:7px;height:7px;border-radius:2px;background:var(--gold);opacity:0;animation:burst 1s cubic-bezier(.1,.8,.3,1) forwards}
.burst i:nth-child(3n){background:var(--green)}.burst i:nth-child(3n+1){background:var(--cyan)}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.4) rotate(140deg)}}

.timer{position:fixed;inset:0;z-index:80;background:radial-gradient(90% 60% at 50% 42%,#101a2c,#070a12);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(18px + var(--safe-t)) 18px calc(24px + var(--safe-b))}
.t-top{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.t-top b{font-family:var(--display);font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.t-top button{min-height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--line2);color:var(--ink2);font-weight:600}
.t-ring{--pc:var(--green);position:relative;width:min(74vw,320px);aspect-ratio:1}

.t-track{stroke:#17202f}

@keyframes pulse{50%{transform:scale(1.025)}}
.t-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.t-mid b{font-size:112px;line-height:.9;color:#fff}
.t-mid b.long{font-size:78px}
.t-mid span{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.06em;text-transform:uppercase;color:var(--pc);margin-top:8px;text-align:center;padding:0 20px}
.t-set{font-size:15px;color:var(--ink2)}
.t-ctrl{display:flex;gap:10px;width:100%;max-width:480px}

.infobtn{
  font-family:var(--display);
  font-size:11px;

}

.guide-cues li::before{content:"";position:absolute;left:4px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--cyan)}

@media (max-width:359px){.pc-main{grid-template-columns:88px 1fr}.ovr{font-size:64px}.stat b{font-size:17px}.stat{padding:9px 8px}.pname{font-size:15px}.btitle b{font-size:16px}.rec b{font-size:24px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<script>
(function(){
'use strict';

/* ================= Helpers ================= */
var KEY='striker_rebuild_v1';
var $=function(s,r){return (r||document).querySelector(s);};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var pad=function(n){return String(n).padStart(2,'0');};

function parseKey(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}

/* ================= Model ================= */

var ATTR={
  pac:{code:'PAC',name:'Elasticity',w:.30},
  sta:{code:'STA',name:'Engine',w:.20},

};
var BLOCKS=[
  {id:'iso',title:'Suspension Tuning',sub:'Tendon isometrics',attr:'pac',xp:35,
   ex:[
     {id:'wall',name:'Wall sit or Spanish squat hold',sets:3,secs:45,
      cues:['Thighs parallel to floor (90° knee angle)','Back flat against wall, no hands resting on knees','Drive through midfoot and heel to load quads statically'],
      safety:'If your patellar tendon stings, slide up slightly to a 60° knee bend.',
      yt:'https://www.youtube.com/watch?v=cWTZ8Am1Ee0'},
     {id:'calf',name:'Seated calf raise hold',sets:3,secs:45,
      cues:['Sit with knees at 90°, weight resting across lower thighs','Press onto balls of feet to parallel / neutral hold','Keep the contraction completely static for the full duration'],
      safety:'Do not bounce at the bottom stretch; keep constant tension to protect the Achilles.',
      yt:'https://www.youtube.com/watch?v=BxfKOyI8sUg'}
   ],
   why:'A tendon is a spring. Long, still holds load it with no bouncing, which tells it to stay stiff. A stiffer spring wastes less energy and passes force into the ground faster, and that is where your first two steps come from. Zero impact, so the suspension gets tuned without being rattled.'},
  {id:'cardio',title:'Power Unit',sub:'Zone 2 engine',attr:'sta',xp:35,
   cues:['Maintain a smooth cadence of 80–90 RPM on the bike','Breathe through your nose or speak full sentences (Zone 2)','Resist the temptation to sprint; this builds mitochondrial density'],
   safety:'Zero grinding. If knees feel friction, lower the resistance and raise cadence.',
   yt:'https://www.youtube.com/watch?v=UoJZtOMU7HQ',
   why:'Steady riding at talking pace teaches the heart to push more blood per beat and builds more mitochondria, the power stations inside muscle cells. Same fuel, bigger engine: you recover faster between sprints and still have power in the 85th minute. Going harder does not build this faster. It builds something else.'},
  {id:'core',title:'Chassis & Shielding',sub:'Cable core and upper body',attr:'phy',xp:40,

  h+='</tbody></table></details></section><section class="card"><h2>Session log</h2>';
  if(!S.sessions.length) h+='<p class="empty">Nothing banked yet. Head to the Garage.</p>';
  else{h+='<ul class="log">'; S.sessions.slice().reverse().forEach(function(s,si){var tot=0;
    if(si===8) h+='</ul><details class="tbl"><summary>Earlier sessions ('+(S.sessions.length-8)+')</summary><ul class="log">';ATTRS.forEach(function(k){tot+=s.xp[k];});
    var bits=[s.blocks.length+' block'+(s.blocks.length===1?'':'s')]; if(s.counted) bits.push('counted'); if(s.data.mins) bits.push(trimNum(s.data.mins)+' min'+(s.data.watts?' at '+trimNum(s.data.watts)+' W':''));
    h+='<li><div><b>'+esc(fmtLong(parseKey(s.date)))+'</b><small>'+esc(bits.join(', '))+'</small></div><span class="xp">+'+tot+' XP</span><button data-act="del-session" data-id="'+esc(s.id)+'" aria-label="Delete session from '+esc(fmtLong(parseKey(s.date)))+'">'+ICON_BIN+'</button></li>';});
    h+='</ul>'+(S.sessions.length>8?'</details>':'');}
  h+='</section>';
  view.innerHTML=h; hoverDay=null; drawChart();
  var cv=$('#chart'), mv=function(e){var r=cv.getBoundingClientRect(); hoverDay=cv._inv(e.clientX-r.left); drawChart();};
  cv.addEventListener('pointerdown',mv); cv.addEventListener('pointermove',mv);
  cv.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse'){hoverDay=null;drawChart();}});
}
window.addEventListener('resize',function(){if(tab==='telemetry') drawChart();});

/* ================= SETUP ================= */
function renderSetup(){
  var s=S.settings, c=clearance();
  var f=function(label,key,val,attrs,hint){return '<label class="field"><span>'+label+'</span><input data-set="'+key+'" value="'+esc(val)+'" '+(attrs||'inputmode="decimal"')+'>'+(hint?'<em>'+hint+'</em>':'')+'</label>';};
  var h='<header class="top"><div><h1>Setup</h1><p>Car set-up and save data. Changes save as you go.</p></div></header>'
    +'<section class="card"><h2>Driver</h2>'
    +f('Name on the card','name',s.name,'class="wide" maxlength="18" autocomplete="off"')
    +f('Reward','rewardName',s.rewardName,'class="wide" maxlength="40" autocomplete="off"')
    +f('Sessions to unlock it','sessionTarget',s.sessionTarget,'inputmode="numeric"')
    +f('Rebuild start date','startDate',S.startDate,'type="date" max="'+dkey()+'"','The chart starts here. Capsules before this date belong in the starting total below.')
    +'</section>'
    +'<section class="card"><h2>Clearance engine</h2>'
    +f('Starting total (mg)','bankedMg',s.bankedMg,'inputmode="numeric"','Everything taken before the start date.')
    +f('Daily amount (mg)','dailyDoseMg',trimNum(s.dailyDoseMg),'','If the doctor changes it, change it here. Days already logged keep their old amount.')
    +f('Body weight (kg)','weightKg',trimNum(s.weightKg))
    +f('Stage 1 target (mg per kg)','stage1PerKg',trimNum(s.stage1PerKg),'','Works out at '+fmt(c.t1)+' mg.')
    +f('Full course target (mg per kg)','fullPerKg',trimNum(s.fullPerKg),'','Works out at '+fmt(c.t2)+' mg.')
    +'<p class="note">Use the figures your doctor gave you. This app only counts. It does not decide when the course ends.</p></section>'
    +'<section class="card"><h2>Starting attributes</h2><p class="small muted" style="margin-top:6px">Where the card started. Every 100 XP adds one point on top.</p><div class="base4">';
  ATTRS.forEach(function(k){h+='<label>'+ATTR[k].code+'<input inputmode="numeric" data-set="base.'+k+'" value="'+s.base[k]+'" aria-label="Starting '+ATTR[k].code+'"></label>';});
  h+='</div></section>'
    +'<section class="card"><h2>Hold timer</h2>'+f('Rest between sets (sec)','restSec',s.restSec,'inputmode="numeric"')
    +'<label class="field"><span>Beeps</span><input type="checkbox" data-set="sound"'+(s.sound?' checked':'')+'></label></section>'
    +'<section class="card"><h2>Save data</h2><p class="small muted" style="margin-top:6px">Everything lives in this browser on this phone. '+(S.lastBackup?'Last backup: '+fmtDate(new Date(S.lastBackup))+'.':'No backup made yet.')+'</p>'
    +'<div class="btnrow"><button class="btn primary" data-act="open-backup">Export backup</button><button class="btn" data-act="open-import">Import backup</button></div>'
    +'<div class="btnrow"><button class="btn danger" data-act="reset">Wipe everything and start again</button></div></section>'
    +'<section class="card"><h2>How scoring works</h2><p class="note" style="margin-top:8px">Each finished block banks XP for one attribute: Suspension +35 PAC, Power Unit +35 STA, Chassis +40 PHY, Sensors +30 DRI. Beating one of your records adds +'+PR_BONUS+'. 100 XP is one attribute point. Overall is weighted for a striker: PAC 30%, DRI 25%, PHY 25%, STA 20%. A session counts toward the reward with '+MIN_BLOCKS+' or more blocks, once a day.</p></section>';
  view.innerHTML=h;
}
function applySetting(el){
  var key=el.dataset.set, s=S.settings, raw=el.value, n=num(raw);
  if(key==='name') s.name=raw.trim().slice(0,18)||'STRIKER';
  else if(key==='rewardName') s.rewardName=raw.trim().slice(0,40)||'New boots';
  else if(key==='sessionTarget') s.sessionTarget=clamp(Math.round(n)||30,1,200);
  else if(key==='startDate'){ if(isKey(raw)&&parseKey(raw)<=new Date()) S.startDate=raw; }
  else if(key==='bankedMg') s.bankedMg=clamp(Math.round(n),0,50000);
  else if(key==='dailyDoseMg') s.dailyDoseMg=clamp(n,0,200);
  else if(key==='weightKg') s.weightKg=clamp(n||55,20,150);
  else if(key==='stage1PerKg'){s.stage1PerKg=clamp(n||120,10,300); if(s.fullPerKg<s.stage1PerKg) s.fullPerKg=s.stage1PerKg;}
  else if(key==='fullPerKg') s.fullPerKg=clamp(n||150,s.stage1PerKg,400);
  else if(key==='restSec') s.restSec=clamp(Math.round(n)||45,10,180);
  else if(key==='sound') s.sound=el.checked;
  else if(key.indexOf('base.')===0) s.base[key.slice(5)]=clamp(Math.round(n)||1,1,99);
  save(); renderSetup(); toast('Saved');
}

/* ================= Backup ================= */
function backupJSON(){return JSON.stringify({app:KEY,exportedAt:new Date().toISOString(),data:S},null,2);}
function openBackup(){
  openModal('<h2>Export backup</h2><p>Save this file somewhere outside the browser: Files, email or a notes app. It holds every capsule log, session and setting.</p>'
    +'<div class="btnrow"><button class="btn primary" data-act="export-file">Save file</button><button class="btn" data-act="export-copy">Copy as text</button></div>'
    +'<textarea id="bk" readonly aria-label="Backup data">'+esc(backupJSON())+'</textarea><div class="btnrow"><button class="btn" data-act="close-modal">Close</button></div>');
}
function markBackup(){S.lastBackup=Date.now();save();}
function exportFile(){
  var json=backupJSON(), name='winter-rebuild-backup-'+dkey()+'.json';
  try{var file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Winter Rebuild backup'}).then(function(){markBackup();toast('Backup shared');}).catch(function(){});return;}}catch(e){}
  try{var url=URL.createObjectURL(new Blob([json],{type:'application/json'})), a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},4000);markBackup();toast('Backup file saved');}
  catch(e){toast('Could not save a file. Use Copy as text.');}
}
function exportCopy(){
  var ta=$('#bk'), ok=function(){markBackup();toast('Copied. Paste it somewhere safe.');};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok).catch(function(){ta.select();toast('Select all and copy the text.');});
  else{ta.select();try{document.execCommand('copy');ok();}catch(e){toast('Select all and copy the text.');}}
}
function openImport(){
  openModal('<h2>Import backup</h2><p>Choose a backup file, or paste the backup text. This replaces everything currently in the app.</p>'
    +'<div class="btnrow"><button class="btn primary" data-act="import-pick">Choose file</button></div><input type="file" id="imf" accept=".json,application/json,text/plain" hidden>'
    +'<textarea id="imt" placeholder="…or paste backup text here" aria-label="Backup text"></textarea>'
    +'<div class="btnrow"><button class="btn" data-act="close-modal">Cancel</button><button class="btn gold" data-act="import-text">Restore from text</button></div>');
  $('#imf').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){tryImport(String(r.result));}; r.onerror=function(){toast('Could not read that file.');}; r.readAsText(f);});
}
function tryImport(text){
  var o; try{o=JSON.parse(text);}catch(e){toast('That is not a valid backup.');return;}
  var data=o&&o.data&&typeof o.data==='object'?o.data:o;
  if(!data||typeof data!=='object'||!data.settings||!Array.isArray(data.sessions)){toast('That is not a Winter Rebuild backup.');return;}
  var next=normalise(data);
  confirmModal('Restore this backup?','It has '+next.sessions.length+' session'+(next.sessions.length===1?'':'s')+' and '+Object.keys(next.doses).length+' logged capsule days. Everything currently in the app will be replaced.','Restore',function(){S=next;save();closeModal();go('hub');toast('Backup restored');});
}

/* ================= Events ================= */
document.addEventListener('click',function(e){
  if(e.target.id==='modal'){ if(!$('.celebrate')) closeModal(); return; }
  var el=e.target.closest('[data-act]'); if(!el) return; var act=el.dataset.act, id=el.dataset.id;
  switch(act){
    case 'tab': go(id); break;
    case 'log-dose': if(S.settings.dailyDoseMg>0&&!(dkey() in S.doses)){S.doses[dkey()]=S.settings.dailyDoseMg;save();buzz(40);audio();beep(880,.1);beep(1320,.2,.09);renderHub();var fu=$('#fuel');if(fu) fu.classList.add('pop');} break;
    case 'undo-dose': delete S.doses[dkey()];save();renderHub();toast('Today’s log removed'); break;
    case 'open-days': openDays(); break;
    case 'toggle-day': if(isKey(id)){ if(id in S.doses) delete S.doses[id]; else if(S.settings.dailyDoseMg>0) S.doses[id]=S.settings.dailyDoseMg; save(); openDays(); renderHub(); } break;
    case 'toggle-block': openBlock=openBlock===id?null:id; renderGarage(); break;
    case 'open-guide': openGuide(id); break;
    case 'set': var i=+el.dataset.i, cur=S.draft.sets[id]||0; S.draft.sets[id]=cur===i+1?i:i+1; save(); buzz(15); renderGarage(); break;
    case 'equip': S.draft.equip=id==='cross'?'cross':'wattbike'; save(); renderGarage(); break;
    case 'timer': timerStart(id); break;
    case 'timer-stop': timerClose(); break;
    case 'timer-pause': timerPause(); break;
    case 'timer-skip': if(T.on){ if(T.paused) timerPause(); timerNext(); } break;
    case 'complete': completeSession(); break;
    case 'celebrate-done': closeModal(); go('hub'); break;
    case 'del-session': confirmModal('Delete this session?','Its XP comes off the card and, if it counted, the unlock tracker drops by one.','Delete',function(){S.sessions=S.sessions.filter(function(s){return s.id!==id;});save();closeModal();render();toast('Session deleted');},true); break;
    case 'open-backup': openBackup(); break;
    case 'export-file': exportFile(); break;
    case 'export-copy': exportCopy(); break;
    case 'open-import': openImport(); break;
    case 'import-pick': $('#imf').click(); break;
    case 'import-text': tryImport($('#imt').value); break;
    case 'reset': confirmModal('Wipe everything?','All capsule logs, sessions, records and settings on this phone will be deleted. Export a backup first if you might want them back.','Wipe it',function(){S=defaults();save();closeModal();go('hub');toast('Reset to factory set-up');},true); break;
    case 'confirm-yes': if(confirmFn){var fn=confirmFn;confirmFn=null;fn();} break;
    case 'close-modal': closeModal(); break;
  }
});
document.addEventListener('input',function(e){
  var k=e.target.dataset&&e.target.dataset.draft; if(!k) return;
  var v=String(e.target.value).slice(0,6);
  if(k.indexOf('kg.')===0) S.draft.kg[k.slice(3)]=v; else S.draft[k]=v;
  save(); garageStatus();
});
document.addEventListener('change',function(e){ if(e.target.dataset&&e.target.dataset.set) applySetting(e.target); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if(!$('#timer').hidden) timerClose(); else if(!$('#modal').hidden&&!$('.celebrate')) closeModal(); } });

try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(function(){}); }catch(e){}
render();
})();
</script>
